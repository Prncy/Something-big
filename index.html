<!doctype html>
<html lang="en">
  <head>
    <!-- meta data -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="This big has been created for big reveals for the copperbelt university student chapters."/>
    <title>Something Big</title>
    <!-- Font Awesome for Social Icons --> 
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css" />
    <!-- Favicon links -->
    <link rel="icon" type="image/png" href="/my-favicon/./favicon-96x96.png?v=20260902" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/my-favicon/./favicon.svg?v=20260902" />
    <link rel="shortcut icon" href="/my-favicon/./favicon.ico?v=20260902" />
    <link rel="apple-touch-icon" sizes="180x180" href="/my-favicon/./apple-touch-icon.png?v=20260902" />

      <script defer src="https://cloud.umami.is/script.js" data-website-id="19de0da7-983d-42f5-b618-97da3c25c420"></script>
  </head>
  <body>
    <main class="experience-container">
        <!-- Hero & Countdown Section -->
        <section class="hero-section">
          <h1 class="project-title">PROJECT: Loading...</h1>
          <p class="subtext">Something is approaching. Watch the alignment.</p>
          <p> Welcome! Get ready for mind-blowing content. We'll explore unspoken truths, learn, connect, and even eat... but that's a story for another time.
          </p>
          <br>
          <div class="countdown-container" id="countdown">
            <div class="time-block"><span class="digits" id="days">00</span><span class="label">Days</span></div>
            <div class="time-block"><span class="digits" id="hours">00</span><span class="label">Hours</span></div>
            <div class="time-block"><span class="digits" id="minutes">00</span><span class="label">Mins</span></div>
            <div class="time-block"><span class="digits" id="seconds">00</span><span class="label">Secs</span></div>
            <button class="social"><a href="https://www.instagram.com/ictazcbulsk?stkn=MW1yeHBydHk1aWdmcQ==" >Instagram</a></button>
            <br>
          </div>
        </section>
        
        <!-- Interactive Character Theater -->
        <section class="character-theater" id="characterTheaterSection">
            <div class="video-viewport" id="videoViewport">
                <video id="characterVideo" playsinline muted preload="auto">
                    <source src="./media/q1.webm" type="video/webm">
                </video>
                <!-- Cinematic Subtitle Layer -->
                <div class="cinematic-caption-layer" id="captionOverlay"></div>
                <!-- Final Cinematic Text Overlays -->
                <div class="final-words-layer" id="finalWordsOverlay"></div>
            </div>

            <!-- Interaction Interface Area -->
            <div class="interaction-interface" id="interactionInterface">
                <div class="action-deck" id="actionDeck">
                    <!-- Buttons are dynamically hydrated by dialogue.js map -->
                </div>
            </div>
        </section>

        <!-- Reveal Portal Deck (Visible only when countdown hits zero) -->
        <section id="portalDeck" class="hidden">
            <a href="https://malichij02.github.io/icatazCbuWebsite/" class="portal-btn">ENTER THE UNKNOWN</a>
        </section>
    </main>

    <script src="dialogue.js"></script>
    <script src="script.js"></script>
</body>
</html>
