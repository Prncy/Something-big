<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="This big has been created for big reveals for the copperbelt university student chapters."/>
    <title>Something Big</title>
    <!-- Font Awesome for Social Icons --> 
    <link rel="stylesheet" href=https://cloudflare.com">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./timer/timer.css" />

    <link rel="icon" type="image/png" href="/my-favicon/./favicon-96x96.png?v=20260902" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/my-favicon/./favicon.svg?v=20260902" />
<link rel="shortcut icon" href="/my-favicon/./favicon.ico?v=20260902" />
<link rel="apple-touch-icon" sizes="180x180" href="/my-favicon/./apple-touch-icon.png?v=20260902" />
<meta name="apple-mobile-web-app-title" content="Something BIg" />
<link rel="manifest" href="/my-favicon/./site.webmanifest?v=20260902" />
  </head>
  <body>
    <!-- Main Container -->
    <main class="hero-container">
      <!-- <h1 class="glow-text">Something Big Is Coming</h1> -->
      <video
        class="neon"
        src="./assets/neon.mp4"
        autoplay
        muted
        loop
        style="width: 100%; height: 100%"
      ></video>

      <!-- Insert your timer container here -->
      <div class="countdown-clock-wrapper">
        <div class="countdown-clock-wrapper">
          <div class="flip-clock" id="mainFlipClock">
            <!-- DAYS CARD -->
            <div class="unit-box">
              <div class="flip-card" data-unit="days">
                <div class="card-face current-val">00</div>
                <div class="card-face next-val">00</div>
              </div>
              <p class="unit-label">Days</p>
            </div>

            <!-- HOURS CARD -->
            <div class="unit-box">
              <div class="flip-card" data-unit="hours">
                <div class="card-face current-val">00</div>
                <div class="card-face next-val">00</div>
              </div>
              <p class="unit-label">Hours</p>
            </div>

            <!-- MINUTES CARD -->
            <div class="unit-box">
              <div class="flip-card" data-unit="minutes">
                <div class="card-face current-val">00</div>
                <div class="card-face next-val">00</div>
              </div>
              <p class="unit-label">Mins</p>
            </div>

            <!-- SECONDS CARD -->
            <div class="unit-box">
              <div class="flip-card" data-unit="seconds">
                <div class="card-face current-val">00</div>
                <div class="card-face next-val">00</div>
              </div>
              <p class="unit-label">Secs</p>
            </div>
          </div>
        </div>
      </div>

      <script src="./timer/timer.js"></script>

      <!-- Example of using your asset -->
      <div class="media-container">
        <img src="./assets/cable dude.png" alt="Coming Soon" class="hero-img" />
      </div>
    </main>

    <!-- Semantic Footer with Social Links -->
    <footer class="social-footer">
      <p>&copy; 2026 Something Big. Stay tuned!</p>
      <div class="social-icons">
        <a href="https://twitter.com" target="_blank" aria-label="Twitter"
          ><i class="fab fa-twitter"> X</i></a>
        <a href="https://instagram.com" target="_blank" aria-label="Instagram"
          ><i class="fab fa-instagram"> Instagram</i></a>
        <a href="#" target="_blank" aria-label="LinkedIn"
          ><i class="fab fa-linkedin"></i> LinkedIn</a>
        <a href="https://youtube.com" target="_blank" aria-label="YouTube"
          ><i class="fab fa-youtube"></i
        > YouTube</a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
